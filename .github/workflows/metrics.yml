name: Weekly Repo Metrics

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:   # allow manual trigger from the Actions tab

permissions:
  contents: read

jobs:
  report:
    name: Fetch GitHub metrics
    runs-on: ubuntu-latest

    steps:
      - name: Repo traffic — views & clones
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          REPO="Evangelion-eva/Stealth"
          echo "=== Traffic: Views (last 14 days) ==="
          curl -s -H "Authorization: token $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/$REPO/traffic/views" | jq .

          echo "=== Traffic: Clones (last 14 days) ==="
          curl -s -H "Authorization: token $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/$REPO/traffic/clones" | jq .

      - name: Repo stats — stars, forks, watchers
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          REPO="Evangelion-eva/Stealth"
          echo "=== Repository stats ==="
          curl -s -H "Authorization: token $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/$REPO" \
            | jq '{stars: .stargazers_count, forks: .forks_count, watchers: .subscribers_count, open_issues: .open_issues_count, size_kb: .size}'

      - name: Open issues & pull requests
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          REPO="Evangelion-eva/Stealth"
          echo "=== Open Issues ==="
          curl -s -H "Authorization: token $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/$REPO/issues?state=open&per_page=10" \
            | jq '[.[] | {number, title, created_at, labels: [.labels[].name]}]'

          echo "=== Open Pull Requests ==="
          curl -s -H "Authorization: token $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/$REPO/pulls?state=open&per_page=10" \
            | jq '[.[] | {number, title, created_at, author: .user.login}]'

      - name: Recent releases
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          REPO="Evangelion-eva/Stealth"
          echo "=== Releases ==="
          curl -s -H "Authorization: token $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/$REPO/releases?per_page=5" \
            | jq '[.[] | {tag_name, name, published_at, download_count: (.assets | map(.download_count) | add // 0)}]'
